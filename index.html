<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Colibrí Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script>window.goatcounter=window.goatcounter||{}</script>
<script data-goatcounter="https://colibri-dash.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
/* VOICE: playful, warm, a little fiesta — a game in a hand-painted housing
   IDEA: a town at dusk during a fiesta, seen from a hummingbird's eye
   PICTURE: the live game itself, full height, with layered town silhouette
   COLOUR and TYPE: magenta-to-marigold dusk, cactus green, papel picado brights; Lilita One + Nunito
   LAYOUT: game centered top, small controls row and tester notes below; stacks naturally on phones */
:root{color-scheme:light dark;--bg:light-dark(#2a1240,#1a0b29);--ink:#fff7ec;--sun:#ffb53b;--pink:#ff3d8b;--green:#2e9e5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,'Baloo 2',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:clip}
.wrap{width:100%;max-width:460px;padding:12px 12px 28px;display:flex;flex-direction:column;gap:12px}
.game{position:relative;width:100%;aspect-ratio:9/16;max-height:82vh;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 0 0 4px #ffb53b,0 0 0 8px #ff3d8b,0 18px 40px #0008;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
@supports (aspect-ratio:9/16){.game{height:auto}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:linear-gradient(#0000,#1a0b2999 40%,#1a0b29cc);pointer-events:none}
.ov.hide{display:none}
.ov h1{font:400 clamp(40px,12vw,56px)/1 'Lilita One',sans-serif;margin:0;color:#fff;text-shadow:0 4px 0 #ff3d8b,0 8px 0 #7a1e6b}
.ov p{margin:0;max-width:30ch;font-weight:600}
.big{font:400 64px/1 'Lilita One',sans-serif;color:var(--sun)}
.ov .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
button{font:800 16px Nunito,'Baloo 2',sans-serif;min-height:44px;padding:10px 18px;border-radius:999px;border:0;cursor:pointer;color:#2a1240;background:var(--sun)}
button.alt{background:#fff7ec}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tap{animation:pulse 1.2s ease-in-out infinite;font-weight:800;color:var(--sun)}
@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.tap{animation:none}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar small{opacity:.75}
.notes{background:#ffffff12;border-radius:16px;padding:14px 16px;font-size:15px}
.notes h2{font:400 22px/1.1 'Lilita One','Baloo 2',sans-serif;margin:0 0 6px;color:var(--sun)}
.notes ul{margin:0;padding-left:18px}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff7ec;color:#2a1240;font-weight:800;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
input{font:800 16px Nunito,'Baloo 2',sans-serif;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid #ffffff40;background:#ffffff14;color:var(--ink);width:100%}
input::placeholder{color:#fff7ec99}
.save{display:flex;gap:8px;pointer-events:auto;width:100%;max-width:310px}.save input{flex:1}.save.hide{display:none}
.lbp{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;gap:10px;padding:56px 18px 18px;background:#1a0b29;overflow:auto;cursor:auto}
.lbp.hide{display:none}
.lbp h2{font:400 30px/1 'Lilita One','Baloo 2',sans-serif;margin:0;color:var(--sun);text-align:center}
.tabs{display:flex;gap:6px;justify-content:center}.tabs button{background:#ffffff1a;color:var(--ink)}.tabs button[aria-pressed=true]{background:var(--sun);color:#2a1240}
.lbg{margin:0;text-align:center;opacity:.85;font-size:14px;font-weight:800}
#lbList{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;flex:1}
#lbList li{display:flex;gap:10px;align-items:center;background:#ffffff12;border-radius:12px;padding:8px 12px;font-weight:800}
#lbList .r{width:1.7em;color:var(--sun);text-align:center}#lbList .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbList li.me{outline:2px solid var(--sun)}#lbList li.msg{background:none;justify-content:center;text-align:center;opacity:.85;font-weight:600}
.gc{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.fbq{font-weight:800;margin:4px 0 2px}
.opts{display:flex;gap:6px;flex-wrap:wrap}.opts button{flex:1;min-width:90px;background:#ffffff1a;color:var(--ink)}.opts button[aria-pressed=true]{background:var(--sun);color:#2a1240}
textarea{font:600 15px Nunito,'Baloo 2',sans-serif;width:100%;min-height:70px;padding:10px 12px;border-radius:12px;border:2px solid #ffffff40;background:#ffffff14;color:var(--ink);resize:vertical}
textarea::placeholder{color:#fff7ec99}
.mute{position:absolute;top:10px;right:10px;z-index:5;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;background:#0006;color:#fff;font-size:20px;line-height:44px}
.langs{display:flex;align-items:center;gap:6px;background:#ffffff12;padding:4px 4px 4px 12px;border-radius:999px}
.langs select{font:800 16px Nunito,'Baloo 2',sans-serif;min-height:40px;padding:6px 10px;border:0;border-radius:999px;background:var(--sun);color:#2a1240;cursor:pointer}
.langs select:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="game" id="game">
    <canvas id="c"></canvas>
    <div class="ov" id="start">
      <h1>Colibrí<br>Dash</h1>
      <p id="t-how"></p>
      <p class="tap" id="t-tap"></p>
      <p id="t-best"></p>
      <p id="t-chal" style="color:var(--sun);font-weight:800;margin-top:2px"></p>
    </div>
    <div class="ov hide" id="over">
      <p id="t-over" style="font:400 30px 'Lilita One','Baloo 2',sans-serif"></p>
      <div class="big" id="final">0</div>
      <p id="t-best2"></p>
      <p id="t-warp" class="hide" style="color:#8fe9f5;font-weight:800"></p>
      <div class="save" id="saveBox"><input id="nick" maxlength="16" autocomplete="nickname" enterkeyhint="done"><button id="saveBtn"></button></div>
      <div class="btns">
        <button id="again"></button>
        <button class="alt" id="share"></button>
        <button class="alt" id="lbBtn"></button>
        <button class="alt" id="fbBtn"></button>
        <button class="alt" id="supBtn"></button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <button class="mute" id="mute">🔊</button>
    <button class="mute" id="trophy" style="right:auto;left:10px">🏆</button>
    <div class="lbp hide" id="lbp" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <h2 id="lbTitle"></h2>
      <div class="tabs"><button id="tabW" aria-pressed="true"></button><button id="tabA" aria-pressed="false"></button></div>
      <p class="lbg" id="lbGroupLabel"></p>
      <ol id="lbList"></ol>
      <label class="gc"><span id="t-group"></span><input id="gcode" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="FIGUEROA"></label>
      <button id="lbClose"></button>
    </div>
    <div class="lbp hide" id="fbp" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
      <h2 id="fbTitle"></h2>
      <p class="fbq" id="q-diff"></p>
      <div class="opts" id="diffOpts"><button data-v="easy"></button><button data-v="ok"></button><button data-v="hard"></button></div>
      <p class="fbq" id="q-hov"></p>
      <div class="opts" id="hovOpts"><button data-v="yes"></button><button data-v="no"></button></div>
      <p class="fbq" id="q-wish"></p>
      <textarea id="wish" maxlength="300"></textarea>
      <button id="fbSend"></button>
      <button class="alt" id="fbClose"></button>
    </div>
  </div>
  <div class="bar">
    <small id="t-proto"></small>
    <label class="langs"><span aria-hidden="true">🌐</span><select id="lang" aria-label="Idioma · Language"><option value="es" lang="es">Español</option><option value="en" lang="en">English</option><option value="pt" lang="pt-BR">Português (BR)</option><option value="fr" lang="fr-CA">Français (CA)</option><option value="frfr" lang="fr-FR">Français (FR)</option><option value="it" lang="it">Italiano</option><option value="de" lang="de">Deutsch</option><option value="af" lang="af">Afrikaans</option><option value="id" lang="id">Bahasa Indonesia</option><option value="fil" lang="fil">Filipino</option><option value="sw" lang="sw">Kiswahili</option><option value="hi" lang="hi">हिन्दी</option><option value="ja" lang="ja">日本語</option><option value="zh" lang="zh-Hans">中文（简体）</option><option value="nah" lang="nah">Nāhuatl</option><option value="yua" lang="yua">Màaya t'àan</option><option value="ru" lang="ru">Русский</option><option value="gn" lang="gn">Avañe’ẽ</option><option value="sv" lang="sv">Svenska</option><option value="no" lang="no">Norsk</option><option value="ko" lang="ko">한국어</option></select></label>
  </div>
  <div class="notes">
    <h2 id="t-nh"></h2>
    <ul id="t-nl"></ul>
  </div>
</div>

 if(state==='over'){if(bird.y<GROUND-12){bird.vy+=GRAV*dt;bird.y+=bird.vy*dt;bird.rot=Math.min(bird.rot+dt*6,1.4)}return}
 if(holding)holdT+=dt;
 const hovering=holding&&holdT>0.25&&nectar>0;
 const ts=slowT>0?0.55:1,gdt=dt*ts;
 if(hovering){bird.vy*=Math.pow(0.02,gdt);nectar=Math.max(0,nectar-dt)}
 else{bird.vy=Math.min(MAXFALL,bird.vy+GRAV*gdt);nectar=Math.min(1,nectar+dt*0.04)}
 bird.y+=bird.vy*gdt;
 bird.rot=hovering?0:Math.max(-0.4,Math.min(0.6,bird.vy/800));
 bird.hover=hovering;hum(hovering);
 if(slowT>0)slowT-=dt;if(invT>0)invT-=dt;if(warpIntroT>0)warpIntroT-=dt;if(starT>0)starT-=dt;if(fluxFlash>0)fluxFlash-=dt;
 if(fireT>0){fireT-=dt;fireTrail.push({y:bird.y});if(fireTrail.length>22)fireTrail.shift()}else if(fireTrail.length)fireTrail=[];
 if(gateT>0)gateT-=dt;if(heartT>0)heartT-=dt;
 if(scene==='proxima'&&gateT<=0&&!mateOn&&mateWaitT>0){mateWaitT-=dt;if(mateWaitT<=0){mateOn=true;mateMeet=true;mateX=92;mateY=120;heartT=1.3;heartX=92;heartY=120;spawnHeart(92,120);sfx.star();gc('mate/appear','Mate appears')}}
 if(mateOn){if(mateMeet){const tx=bird.x-30;mateX+=(tx-mateX)*Math.min(1,dt*2.2);mateY+=(bird.y-mateY)*Math.min(1,dt*2.2);if(Math.hypot(mateX-tx,mateY-bird.y)<12)mateMeet=false}else{mateX=bird.x-34;mateY+=(bird.y-mateY)*Math.min(1,dt*6)}}
 if(rainbow){trail.push({x:bird.x,y:bird.y});if(trail.length>18)trail.shift()}
 speed=(105+Math.min(score,50)*2)*(warpIntroT>0?2.2:warpRun?1.3:1);
 spawnT-=gdt;if(spawnT<=0){spawn();spawnT=230/speed}
 pupT-=gdt;if(pupT<=0&&score>=3){spawnPup();pupT=7+Math.random()*4}
 wormT-=gdt;if(wormT<=0&&score>=5){const pt=(score>=8&&Math.random()<0.6)?'hole':'worm';pups.push({x:W+24,y:220+Math.random()*200,t:pt,got:false});wormT=12+Math.random()*5}
 fluxT-=gdt;if(fluxT<=0&&score>=8){pups.push({x:W+24,y:220+Math.random()*200,t:'flux',got:false});fluxT=20+Math.random()*8}
 gateST-=gdt;if(gateST<=0&&score>=15){pups.push({x:W+24,y:220+Math.random()*180,t:'gate',got:false});gateST=26+Math.random()*10}
 for(const u of pups){u.x-=speed*gdt;if(!u.got&&Math.hypot(u.x-bird.x,u.y-bird.y)<((u.t==='worm'||u.t==='hole'||u.t==='gate')?34:24)){u.got=true;if(u.t==='shield'){shield=true;sfx.power()}else if(u.t==='slow'){slowT=4;sfx.power()}else if(u.t==='star'){starT=30;sfx.star()}else if(u.t==='flux')fluxJump();else if(u.t==='gate')startGate();else if(u.t==='worm')startWarp('earth');else startWarp('space')}}
 pups=pups.filter(u=>u.x>-30&&!u.got);
 for(const p of pipes){
  p.x-=speed*gdt;
  if(p.amp){p.cy=p.base+Math.sin(time*1.8+p.ph)*p.amp;p.cy=Math.max(110,Math.min(GROUND-110,p.cy))}
  if(!p.scored&&p.x+PW<bird.x){p.scored=true;score++}
  const fx=p.x+PW/2,fy=p.fl.y-p.base+p.cy;
  if(!p.fl.got&&Math.hypot(fx-bird.x,fy-bird.y)<26){p.fl.got=true;flowers++;score++;nectar=Math.min(1,nectar+0.4);sfx.chime()}
  const top=p.cy-p.gap/2,bot=p.cy+p.gap/2,r=11;
  if(bird.x+r>p.x+4&&bird.x-r<p.x+PW-4&&(bird.y-r<top||bird.y+r>bot))hit(false);
 }
 pipes=pipes.filter(p=>p.x>-PW-40);
 checkMiles();
 if(godMode&&!godTimed&&score>=100){godTimed=true;godEndT=30;gc('godmode/countdown','God countdown')}
 if(godTimed&&godMode){godEndT-=dt;if(godEndT<=0)godMode=false}
 if(CHAL>0&&!chalBeaten&&score>CHAL){chalBeaten=true;const L=cx();celebText=L.won;celebT=2.6;sfx.fanfare();for(let i=0;i<24;i++)parts.push({x:W/2+(Math.random()-.5)*90,y:120,vx:(Math.random()-.5)*230,vy:-130-Math.random()*170,rot:Math.random()*6,vr:(Math.random()-.5)*9,c:FLAGS[i%FLAGS.length],f:Math.random()<.4,life:1.7});gc('beat-challenge','Beat challenge')}
 if(bird.y>GROUND-12){bird.y=GROUND-12;hit(true)}
 if(bird.y<-30){bird.y=-30;bird.vy=0}
}

 } else if(scene==='jungle'){ctx.fillStyle='#0c4a30';
  for(let k=0;k<2;k++)for(let i=0;i<14;i++){const x=i*48-off+k*14*48;if(x<-60||x>W+30)continue;const h=70+((i*37)%60);

   ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x+42,GROUND-h);ctx.lineTo(x+84,GROUND);ctx.closePath();ctx.fill()}
  ctx.fillStyle='#eef8fd';const o2=(off*1.5)%720;

 } else if(scene==='hawaii'){const vx=((-off*0.4)%(W+320))-160;ctx.fillStyle='#5a3466';

 else if(u.t==='gate'){const g=ctx.createRadialGradient(0,0,2,0,0,13);g.addColorStop(0,'#dff2ff');g.addColorStop(.5,'#3f93d0');g.addColorStop(1,'#1a5a90');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();ctx.fillStyle='#eaf7ff';for(let i=0;i<7;i++){const a=time*1.5+i*0.9,r=3+((i*3)%9);ctx.globalAlpha=0.35+0.4*Math.abs(Math.sin(time*3+i));ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,1.1,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#2b2c34';ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,16.5,0,7);ctx.stroke();ctx.strokeStyle='#50525e';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,19.3,0,7);ctx.stroke();ctx.beginPath();ctx.arc(0,0,13.7,0,7);ctx.stroke();for(let k=0;k<9;k++){const a=-Math.PI/2+k*(2*Math.PI/9);ctx.save();ctx.rotate(a);ctx.translate(0,-16.5);ctx.fillStyle='#6fd0ff';ctx.globalAlpha=0.5;ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(-5,-3.5);ctx.lineTo(5,-3.5);ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#aee6ff';ctx.beginPath();ctx.moveTo(0,3.2);ctx.lineTo(-3,-2.4);ctx.lineTo(3,-2.4);ctx.closePath();ctx.fill();ctx.restore()}}
 else if(u.t==='worm'){ctx.fillStyle='#8f5cff';ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();ctx.globalAlpha=1;ctx.rotate(time*3);const H6=['#ff3d8b','#ffd23b','#3ccf6e','#27c1d9','#8f5cff'];for(let a=0;a<5;a++){ctx.strokeStyle=H6[a];ctx.lineWidth=3.5;ctx.beginPath();for(let t2=0;t2<6.6;t2+=0.3){const rr2=2+t2*3;ctx.lineTo(Math.cos(t2+a*1.26)*rr2,Math.sin(t2+a*1.26)*rr2)}ctx.stroke()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,3.5,0,7);ctx.fill()}
 else{ctx.fillStyle='#ff8a3d';ctx.globalAlpha=0.25;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();ctx.globalAlpha=1;ctx.save();ctx.rotate(time*2);const DK=['#ffb53b','#ff6b3d','#8f5cff','#27c1d9'];for(let a=0;a<4;a++){ctx.strokeStyle=DK[a];ctx.lineWidth=3;ctx.globalAlpha=0.85;ctx.beginPath();ctx.ellipse(0,0,17-a*0.6,8-a*0.4,a*0.5,0,7);ctx.stroke()}ctx.globalAlpha=1;ctx.restore();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.stroke();ctx.globalAlpha=1}
 ctx.restore()}}
function drawShield(){if(!shield&&invT<=0)return;ctx.save();ctx.globalAlpha=0.35+0.3*Math.sin(time*9);ctx.strokeStyle=shield?'#8fe9f5':'#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bird.x,bird.y,20,0,7);ctx.stroke();ctx.restore()}
function drawStarAura(){if(starT<=0&&!godMode)return;ctx.save();ctx.globalAlpha=0.45+0.3*Math.sin(time*8);ctx.strokeStyle='#ffd23b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bird.x,bird.y,20,0,7);ctx.stroke();ctx.globalAlpha=1;for(let i=0;i<3;i++){const a=time*4+i*2.1;ctx.fillStyle='#fff6c0';ctx.beginPath();ctx.arc(bird.x+Math.cos(a)*22,bird.y+Math.sin(a)*22,2.5,0,7);ctx.fill()}ctx.restore()}
function drawFluxFlash(){if(fluxFlash<=0)return;ctx.fillStyle='#dff6ff';ctx.globalAlpha=Math.min(1,fluxFlash*2);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
function drawHeart(){if(heartT<=0)return;const sc=1.4+(1-heartT/1.3)*3.6;ctx.save();ctx.translate(heartX,heartY);ctx.scale(sc,sc);ctx.globalAlpha=Math.max(0,heartT/1.3);ctx.strokeStyle='#ff3d8b';ctx.lineWidth=2/sc;ctx.beginPath();for(let i=0;i<=40;i++){const t=i/40*6.283,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));if(i===0)ctx.moveTo(hx*0.6,hy*0.6);else ctx.lineTo(hx*0.6,hy*0.6)}ctx.closePath();ctx.stroke();ctx.restore();ctx.globalAlpha=1}
function drawMate(){if(!mateOn)return;const mx=mateX,my=mateY+Math.sin(time*5)*4,wf=Math.sin(time*50);ctx.save();ctx.translate(mx,my);ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(-3,-7,13,4+wf*3,-0.6,0,7);ctx.fill();ctx.fillStyle='#ff6fae';ctx.beginPath();ctx.ellipse(0,0,13,9,0,0,7);ctx.fill();ctx.fillStyle='#e23f86';ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-22,-4);ctx.lineTo(-20,5);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-3,3,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(8,-3,1.6,0,7);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(9,-6);ctx.lineTo(11.5,-8);ctx.moveTo(10.5,-5);ctx.lineTo(13,-6.5);ctx.stroke();ctx.strokeStyle='#2a1a1a';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(12,-1);ctx.lineTo(25,1);ctx.stroke();ctx.fillStyle='#ff3d8b';for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(-2+Math.cos(k*1.26)*4,-11+Math.sin(k*1.26)*4,2,1.3,k*1.26,0,7);ctx.fill()}ctx.fillStyle='#ffd23b';ctx.beginPath();ctx.arc(-2,-11,1.6,0,7);ctx.fill();ctx.fillStyle='#66e3b4';ctx.beginPath();ctx.ellipse(-2,-4+wf*3,9,3,-0.4,0,7);ctx.fill();ctx.restore()}
function drawGate(){if(gateT<=0)return;const p=1-gateT/GATE_DUR,al=p<0.2?p/0.2:(p>0.8?(1-p)/0.2:1),cx=W/2,cy=H*0.42;ctx.save();ctx.globalAlpha=al;ctx.fillStyle='#070018';ctx.fillRect(0,0,W,H);const C=['#8fe9f5','#ffd23b','#ff6b9d','#8f5cff','#ffffff'];for(let i=0;i<44;i++){const a=i*0.1428,r0=((i*53+time*700)%320),r1=r0+46;ctx.strokeStyle=C[i%5];ctx.globalAlpha=al*0.8;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke()}for(let i=0;i<11;i++){const r=Math.abs(((i*42-(time*480)%42))+(p*70))%340;ctx.strokeStyle=i%2?'#6fd0ff':'#b58cff';ctx.globalAlpha=al*0.5;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke()}if(p<0.25){const er=p/0.25*150;ctx.strokeStyle='#eaffff';ctx.globalAlpha=al*(1-p/0.25);ctx.lineWidth=5;ctx.beginPath();ctx.arc(cx,cy,er,0,7);ctx.stroke()}ctx.restore();ctx.globalAlpha=1}
function drawFire(){if(fireTrail.length<2)return;const n=fireTrail.length;for(let i=0;i<n;i++){const t=fireTrail[i],a=(i+1)/n,x=bird.x-12-(n-1-i)*7;for(const dy of [-5,5]){const fl=1+Math.sin(time*30+i)*0.3;ctx.globalAlpha=a*0.7;ctx.fillStyle='#e8341f';ctx.beginPath();ctx.arc(x,t.y+dy,(2+5*a)*fl,0,7);ctx.fill();ctx.globalAlpha=a*0.85;ctx.fillStyle='#ff8a3d';ctx.beginPath();ctx.arc(x,t.y+dy,(1.2+3.2*a)*fl,0,7);ctx.fill();ctx.globalAlpha=a;ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(x,t.y+dy,(0.6+1.6*a)*fl,0,7);ctx.fill()}}ctx.globalAlpha=1}
function drawBolts(){if(fireT<=0)return;const bx=bird.x,by=bird.y;for(let b=0;b<5;b++){if(Math.random()<0.45)continue;const a0=Math.random()*6.283,r0=12+Math.random()*6,r1=26+Math.random()*18,sx=bx+Math.cos(a0)*r0,sy=by+Math.sin(a0)*r0,ex=bx+Math.cos(a0)*r1,ey=by+Math.sin(a0)*r1;ctx.beginPath();ctx.moveTo(sx,sy);for(let k=1;k<=4;k++){const t=k/4;ctx.lineTo(sx+(ex-sx)*t+(Math.random()-0.5)*11,sy+(ey-sy)*t+(Math.random()-0.5)*11)}ctx.strokeStyle='#2fe0ff';ctx.lineWidth=2.5;ctx.globalAlpha=0.85;ctx.stroke();ctx.strokeStyle='#eaffff';ctx.lineWidth=1;ctx.globalAlpha=1;ctx.stroke()}ctx.globalAlpha=1}
function frame(t){
 const dt=Math.min(0.033,(t-(last||t))/1000);last=t;
 update(dt);
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*8*shake/.35,(Math.random()-.5)*8*shake/.35);
 drawBg();
 for(const p of pipes){drawPapel(p);drawCactus(p);drawFlower(p)}
 drawPups();drawTrail();drawFire();drawBird();drawMate();drawShield();drawStarAura();drawBolts();drawParts();drawHeart();ctx.restore();drawHud();drawCeleb();drawWarp();drawFluxFlash();drawGate();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
